<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luz Gabriela Mamani Ramos | Bitácora Espacial</title>
  <style>
    :root {
      --bg-espacio: #02050e;
      --panel-oscuro: rgba(7, 13, 28, 0.84);
      --panel-hover: rgba(18, 29, 54, 0.96);
      --borde-neon: rgba(56, 189, 248, 0.36);
      --borde-fuerte: rgba(56, 189, 248, 0.85);
      --borde-activo: rgba(192, 132, 252, 0.88);
      --texto-principal: #f8fafc;
      --texto-secundario: #cbd5e1;
      --texto-apagado: #94a3b8;
      --acento-cian: #38bdf8;
      --acento-violeta: #c084fc;
      --acento-menta: #5eead4;
      --sombra-profunda: 0 26px 65px rgba(0, 0, 0, 0.78);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-espacio);
      color: var(--texto-principal);
      overflow-x: hidden;
      position: relative;
      selection-background-color: rgba(192, 132, 252, 0.35);
    }

    ::selection {
      background: rgba(192, 132, 252, 0.35);
      color: #ffffff;
    }

    /* Scrollbar sutil espacial */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #030712;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.45), rgba(192, 132, 252, 0.45));
      border-radius: 999px;
    }

    /* =========================================
       FONDO ESPACIAL: NEBULOSAS, ESTRELLAS Y REJILLA
       ========================================= */
    .fondo-espacial {
      position: fixed;
      inset: 0;
      z-index: -3;
      background:
        radial-gradient(circle at 15% 25%, rgba(56, 189, 248, 0.25), transparent 42%),
        radial-gradient(circle at 85% 18%, rgba(168, 85, 247, 0.26), transparent 46%),
        radial-gradient(circle at 68% 86%, rgba(94, 234, 212, 0.14), transparent 50%),
        linear-gradient(155deg, #02040a 0%, #060b19 52%, #02050e 100%);
    }

    .fondo-espacial::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1.7px 1.7px at 12% 18%, rgba(255, 255, 255, 0.92), transparent),
        radial-gradient(1.1px 1.1px at 28% 68%, rgba(255, 255, 255, 0.72), transparent),
        radial-gradient(2.1px 2.1px at 45% 32%, rgba(125, 211, 252, 0.92), transparent),
        radial-gradient(1px 1px at 67% 15%, rgba(255, 255, 255, 0.82), transparent),
        radial-gradient(1.7px 1.7px at 78% 58%, rgba(216, 180, 254, 0.92), transparent),
        radial-gradient(1.1px 1.1px at 90% 82%, rgba(255, 255, 255, 0.78), transparent),
        radial-gradient(1.2px 1.2px at 35% 88%, rgba(94, 234, 212, 0.75), transparent),
        radial-gradient(1.5px 1.5px at 54% 52%, rgba(255, 255, 255, 0.68), transparent);
      background-size: 380px 380px;
      animation: derivaEstrellas 50s linear infinite;
    }

    @keyframes derivaEstrellas {
      from {
        transform: translateY(0px);
      }
      to {
        transform: translateY(-95px);
      }
    }

    .fondo-espacial::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(56, 189, 248, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(56, 189, 248, 0.06) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(circle at 68% 50%, black 22%, transparent 82%);
      -webkit-mask-image: radial-gradient(circle at 68% 50%, black 22%, transparent 82%);
    }

    /* Anillos orbitales decorativos */
    .anillo-orbital {
      position: fixed;
      left: -140px;
      top: 50%;
      width: 560px;
      height: 560px;
      border-radius: 50%;
      border: 1px dashed rgba(56, 189, 248, 0.18);
      transform: translateY(-50%);
      pointer-events: none;
      z-index: -1;
      animation: girarAnillo 65s linear infinite;
    }

    .anillo-orbital::before {
      content: "";
      position: absolute;
      inset: 46px;
      border-radius: 50%;
      border: 1px solid rgba(192, 132, 252, 0.12);
    }

    @keyframes girarAnillo {
      from {
        transform: translateY(-50%) rotate(0deg);
      }
      to {
        transform: translateY(-50%) rotate(360deg);
      }
    }

    /* Vistas */
    .vista {
      display: none;
      min-height: 100vh;
      width: 100%;
    }

    .vista.activa {
      display: flex;
    }

    /* =========================================
       PORTADA ASIMÉTRICA: IZQUIERDA / DERECHA
       ========================================= */
    .portada-layout {
      align-items: center;
      justify-content: space-between;
      gap: 3rem;
      padding: 3rem 5%;
    }

    .lado-izquierdo {
      flex: 1.25;
      max-width: 750px;
    }

    .etiqueta-orbital {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--acento-menta);
      border: 1px solid rgba(94, 234, 212, 0.42);
      background: rgba(94, 234, 212, 0.08);
      padding: 0.4rem 0.95rem;
      border-radius: 999px;
      margin-bottom: 1.35rem;
      box-shadow: 0 0 22px rgba(94, 234, 212, 0.14);
    }

    .punto-pulso {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--acento-menta);
      box-shadow: 0 0 12px var(--acento-menta);
      animation: latido 2.2s infinite ease-in-out;
    }

    @keyframes latido {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.35);
        opacity: 0.65;
      }
    }

    .saludo-grande {
      font-size: clamp(2.25rem, 4.7vw, 4.15rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.028em;
      text-shadow: 0 0 40px rgba(56, 189, 248, 0.24);
    }

    .saludo-grande span {
      background: linear-gradient(95deg, #7dd3fc 0%, #c084fc 55%, #5eead4 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .linea-decorativa {
      margin-top: 1.6rem;
      width: 140px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--acento-cian), var(--acento-violeta), transparent);
    }

    /* Panel derecho de botones */
    .lado-derecho {
      flex: 0.85;
      max-width: 445px;
      width: 100%;
      background: var(--panel-oscuro);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--borde-neon);
      border-radius: 24px;
      padding: 1.55rem;
      position: relative;
      overflow: hidden;
      box-shadow:
        var(--sombra-profunda),
        0 0 36px rgba(56, 189, 248, 0.13),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .lado-derecho:hover {
      border-color: rgba(56, 189, 248, 0.58);
      box-shadow:
        var(--sombra-profunda),
        0 0 44px rgba(56, 189, 248, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .lado-derecho::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--acento-cian), var(--acento-violeta), transparent);
    }

    .cabecera-menu {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .titulo-menu {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--acento-violeta);
      font-weight: 700;
    }

    .contador-sectores {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--texto-apagado);
      letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums;
    }

    .lista-botones {
      display: flex;
      flex-direction: column;
      gap: 0.56rem;
    }

    .btn-seccion {
      width: 100%;
      background: rgba(13, 21, 39, 0.84);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 13px;
      padding: 0.76rem 1rem;
      color: var(--texto-principal);
      font-size: 0.94rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.2s ease,
                  background 0.2s ease,
                  box-shadow 0.2s ease;
    }

      content:
